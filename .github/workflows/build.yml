name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Find and extract zip file
      run: |
        echo "Searching for zip files..."
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "No zip file found in root!"
          exit 1
        fi
        echo "Found zip file: $ZIP_FILE"
        mkdir -p extracted_code
        unzip -q "$ZIP_FILE" -d extracted_code
        cd extracted_code
        if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls -1)" ]; then
          cd $(ls -1)
        fi
        cp -r . ../
        cd ..
        rm -rf extracted_code

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
