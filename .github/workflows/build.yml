name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract source code
      run: |
        echo "Listing files in root:"
        ls -la
        
        # Look for any zip file or fallback to current directory
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -q "$ZIP_FILE" -d extracted_code
          cd extracted_code
          # If there is a single folder inside, enter it
          if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls -1)" ]; then
            cd $(ls -1)
          fi
          cp -r . ../../
          cd ../..
          rm -rf extracted_code
        else
          echo "No zip file found, looking for direct source files..."
        fi

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
